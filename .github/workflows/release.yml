# Publishes to npm when a version tag (v*) is pushed. Publishing uses npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret. See RELEASING.md for the
# one-time npmjs.com setup.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Check that the tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # Node 22 bundles npm 10.x, but Trusted Publishing (the OIDC token
      # exchange that `npm publish` performs) needs npm >= 11.5.1. Without it
      # the registry rejects the publish with a misleading E404 ("not in this
      # registry") instead of an auth error.
      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install --global npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance
